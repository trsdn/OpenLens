name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/trsdn/OpenLens/blob/master/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenLens version
      description: About OpenLens, or `Contents/Info.plist` → `CFBundleShortVersionString`.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "14.5, MacBook Pro M4 Pro"
    validations:
      required: true

  - type: input
    id: camera
    attributes:
      label: Camera
      description: The physical camera or capture device OpenLens is reading from.
      placeholder: "Elgato Cam Link 4K with a Sony A6100"

  - type: input
    id: consumer
    attributes:
      label: Which app was using the virtual camera
      placeholder: "Zoom 6.1, Teams, Meet in Chrome"

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Optional but very useful:
        `log show --last 10m --predicate 'subsystem == "com.trsdn.openlens"' --info`
      render: text
